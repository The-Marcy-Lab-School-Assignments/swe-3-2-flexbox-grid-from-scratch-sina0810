<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcy Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="container">
        <img class="img-logo" src="./img/logo.png" alt="Logo">
        <h1>Marcy Music</h1>
        <nav class="link">
            <a href="#">Library</a>
            <a href="#">Explore</a>
            <a href="#">Profile</a>
        </nav>
    </header>

    <main class="main-container">
        <h1>Playlists</h1>

        <section class="first-section">
            <ul>
                <li class="box-one">
                    <figure>
                        <img  src="./img/playlist-chill.jpg" alt="image 1"
                        
                        >
                        <figcaption class="chill-vibes">Chill Vibes</figcaption>
                    </figure>
                </li>

                <li class="box-two">
                    <figure>
                        <img  src="./img/playlist-focus.jpg" alt="image 2">
                        <figcaption>Focuss</figcaption>
                    </figure>
                </li>

                <li class="box-three">
                    <figure>
                        <img src="./img/playlist-late-night.jpg" alt="image 3">
                        <figcaption>Late Night</figcaption>
                    </figure>
                </li>

                <li>
                    <figure>
                        <img src="./img/playlist-love.jpg" alt="image 4">
                        <figcaption>Love Songs</figcaption>
                    </figure>
                </li>

                <li>
                    <figure>
                        <img src="./img/playlist-oldies.jpg" alt="image 5">
                        <figcaption>Oldies</figcaption>
                    </figure>
                </li>

                <li>
                    <figure>
                        <img src="./img/playlist-sad.jpg" alt="image 6">
                        <figcaption>Sad</figcaption>
                    </figure>
                </li>

            </ul>
            </section>

            <section class="second-section">
            <h1>Albums</h1>
            <ul>
                <li>
                    <figure>
                        <img src="./img/album-electric-soul.jpg" alt="image 7">
                        <figcaption>Midnight Dreams</figcaption>
                        <p>Luna Ray</p>
                    </figure>
                </li>

                <li>
                    <figure>
                        <img src="./img/album-golden-hour.jpg" alt="image 8">
                        <figcaption>Electric Soul</figcaption>
                        <p>The Voltage</p>
                    </figure>
                </li>

                <li>
                    <figure>
                        <img src="./img/album-kermit-does-jazz.jpg" alt="image 9">
                        <figcaption>Golden Hour</figcaption>
                        <p>Sunset Collective</p>
                    </figure>
                </li>

                <li>
                    <figure>
                        <img src="./img/album-midnight-dreams.jpg" alt="image 10">
                        <figcaption>Kermit Does Jazz</figcaption>
                        <p>Kermit The Frog</p>
                    </figure>
                </li>


            </ul>
            <footer>
        <p class="made-with"> 
        Made with <span class="heart"></span> at <span>Marcy Lab School</span>
        </p>
    </footer>
        </section>
    </main>
   
</body>
</html>
